# Development stack. Vite serves directly, no Caddy in front — one less hop
# between the browser and HMR. Run with: docker compose -f compose.dev.yml up
#
# Separate project name from the prod stack, otherwise Compose treats both
# `web` services as the same container and they overwrite each other.
name: schnur23-dev

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      # Loopback-bound deliberately: Docker writes its own iptables rules, so a
      # bare "5173:5173" is reachable from the internet even while UFW reports
      # the port closed.
      - "127.0.0.1:${DEV_PORT:-5173}:5173"
    volumes:
      # Source bind mount so Vite sees edits (inotify works natively on Linux).
      - ./frontend:/app
      # Named volume for node_modules: keeps the host's glibc builds from
      # shadowing the container's musl ones. Refilled by the startup install,
      # and also holds pnpm's store (see npm_config_store_dir in Dockerfile.dev).
      - web_node_modules:/app/node_modules
      # Keeps the generated .svelte-kit out of the bind mount, otherwise it
      # lands root-owned on the host.
      - web_svelte_kit:/app/.svelte-kit

volumes:
  web_node_modules:
  web_svelte_kit:
