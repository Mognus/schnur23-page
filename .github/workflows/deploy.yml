name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      # Secrets live on the server, never in the repo. Copied into .env so
      # docker compose picks up SITE_ADDRESS and ORIGIN.
      - name: Copy .env
        run: cp ~/schnur23.env .env

      - name: Build and deploy
        run: |
          docker compose build
          docker compose up -d

      - name: Cleanup old images
        run: docker image prune -f
